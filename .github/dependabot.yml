version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Brisbane
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: scope
    groups:
      nuget-dependencies:
        patterns: [ "*" ]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/src/chrome-extension"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Brisbane
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: scope
    groups:
      npm-dependencies:
        patterns: [ "*" ]
    open-pull-requests-limit: 5

  - package-ecosystem: pub
    directory: "/src/mobile_app"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Brisbane
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: scope
    groups:
      pub-dependencies:
        patterns: [ "*" ]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Brisbane
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: scope
    groups:
      github-actions-dependencies:
        patterns: [ "*" ]
    open-pull-requests-limit: 5

