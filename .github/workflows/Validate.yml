name: Validate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions: { }

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:

  TestWebApi:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: TestWebApi
        id: TestWebApi
        run: dotnet run --project _atom/_atom.csproj -- TestWebApi --skip --headless

  TestChromeExtension:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: TestChromeExtension
        id: TestChromeExtension
        run: dotnet run --project _atom/_atom.csproj -- TestChromeExtension --skip --headless

  TestMobileApp:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: TestMobileApp
        id: TestMobileApp
        run: dotnet run --project _atom/_atom.csproj -- TestMobileApp --skip --headless

      - name: Store MobileAppCoverage
        uses: actions/upload-artifact@v7
        with:
          name: MobileAppCoverage
          path: '${{ github.workspace }}/.github/publish/MobileAppCoverage'

  BuildDocs:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: BuildDocs
        id: BuildDocs
        run: dotnet run --project _atom/_atom.csproj -- BuildDocs --skip --headless

