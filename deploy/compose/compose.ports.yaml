# Behind a reverse proxy that runs on the host itself (COMPOSE_FILE adds this file): the API and the web app listen
# on the server's loopback only, and the proxy forwards to them. Docker's port forwarding then connects to the API
# from the host's address on one of the API's two networks, and which one depends on the Docker version, so the API
# trusts the forwarded headers from both gateways, which are the host itself; PROXY_TRUSTED_CIDR is not used.

services:
  api:
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"
    environment:
      ForwardedHeaders__KnownNetworks__0: 172.30.0.1/32
      ForwardedHeaders__KnownNetworks__1: 172.30.1.1/32
  web:
    ports:
      - "127.0.0.1:${WEB_PORT:-18081}:8080"
