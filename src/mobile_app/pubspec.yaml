name: passel_mobileapp
description: "Passel MobileApp"
homepage: https://passel.link
publish_to: 'none'

# On Android the build-name is the versionName and the build-number the versionCode;
# `atom BuildMobileAppAndroid` passes both from GitVersion and the build timestamp.
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # 3.4 needs Dart 3.12; bump it with the Flutter SDK.
  flutter_riverpod: ^3.3.2
  http: ^1.5.0
  url_launcher: ^6.3.1
  google_sign_in: ^7.2.0
  custom_refresh_indicator: ^4.0.1
  # 1.9.0 builds only with AGP 9 (its Gradle script expects built-in Kotlin)
  # and 2.x needs Dart 3.12 (through material_ui); bump it with the SDKs.
  dynamic_color: '>=1.7.0 <1.9.0'
  share_plus: ^13.3.1
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  # Configuration (API URL, client ids) is passed with --dart-define or
  # --dart-define-from-file, not bundled as an asset; see
  # lib/config/app_config.dart and .env.example.
