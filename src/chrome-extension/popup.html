<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link rel="stylesheet" href="popup.css" />
</head>
<body>
    <header>
        <img src="icons/icon-48.png" alt="Passel" class="header-icon" />
        <span class="header-title">Passel</span>
        <div id="auth-signed-in" class="header-auth hidden">
            <span id="user-email" class="header-email"></span>
            <button id="sign-out-btn" class="md-btn-icon" type="button" title="Sign out">
                <span class="material-symbols-outlined">logout</span>
            </button>
        </div>
    </header>

    <div id="status" class="status-bar hidden" role="alert"></div>

    <main>
        <section id="auth-signed-out" class="section">
            <button id="sign-in-btn" class="md-btn md-btn-filled" type="button">
                <span class="material-symbols-outlined btn-icon">login</span>
                Sign in with Google
            </button>
        </section>

        <div id="auth-divider" class="divider"></div>

        <section id="content-section" class="section disabled-section">
            <button id="send-page" class="md-btn md-btn-filled" type="button" disabled>
                <span class="material-symbols-outlined btn-icon">language</span>
                Send Current Page
            </button>
        </section>

        <div class="divider"></div>

        <section class="section disabled-section">
            <div class="text-field" id="text-field-container">
                <textarea id="freetext" rows="3" placeholder=" " disabled></textarea>
                <label for="freetext">Text to send</label>
            </div>
            <button id="send-text" class="md-btn md-btn-tonal" type="button" disabled>
                <span class="material-symbols-outlined btn-icon">chat</span>
                Send Text
            </button>
        </section>

        <div class="divider"></div>

        <section id="image-section" class="section disabled-section">
            <div id="drop-zone" class="drop-zone">
                <span class="material-symbols-outlined drop-zone-icon">add_photo_alternate</span>
                <span class="drop-zone-text">Drop, paste, or click to browse</span>
                <input type="file" id="image-input" accept="image/*" hidden />
            </div>
            <div id="image-preview-container" class="image-preview-container hidden">
                <img id="image-preview" class="image-preview" />
                <button id="clear-image" class="md-btn-icon clear-image-btn" type="button" title="Remove image">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <button id="send-image" class="md-btn md-btn-tonal" type="button" disabled>
                <span class="material-symbols-outlined btn-icon">image</span>
                Send Image
            </button>
        </section>
    </main>

    <script type="module" src="dist/popup.js"></script>
</body>
</html>
