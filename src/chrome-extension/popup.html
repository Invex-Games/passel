<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passel</title>
    <link rel="stylesheet" href="popup.css" />
</head>
<body>
    <header>
        <img src="icons/icon-48.png" alt="Passel" class="header-icon" />
        <span class="header-title">Passel</span>
        <div id="auth-signed-in" class="header-auth hidden">
            <span id="user-email" class="header-email"></span>
            <button id="sign-out-btn" class="md-btn-icon" type="button" title="Sign out">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
            </button>
        </div>
    </header>

    <div id="status" class="status-bar hidden" role="alert"></div>

    <main>
        <section id="auth-signed-out" class="section">
            <button id="sign-in-btn" class="md-btn md-btn-filled" type="button">
                <svg class="icon btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                    <polyline points="10 17 15 12 10 7" />
                    <line x1="15" y1="12" x2="3" y2="12" />
                </svg>
                <span class="spinner"></span>
                <span class="btn-label">Sign in with Google</span>
                <span class="btn-loading-label">Signing in…</span>
            </button>
        </section>

        <div id="auth-divider" class="divider"></div>

        <section id="content-section" class="section auth-required disabled-section">
            <button id="send-page" class="md-btn md-btn-filled" type="button" disabled>
                <svg class="icon btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
                    <path d="M2 12h20" />
                </svg>
                <span class="spinner"></span>
                <span class="btn-label">Send Current Page</span>
                <span class="btn-loading-label">Sending…</span>
            </button>
        </section>

        <div class="divider"></div>

        <section id="text-section" class="section auth-required disabled-section">
            <div class="text-field" id="text-field-container">
                <textarea id="freetext" rows="3" placeholder=" " disabled></textarea>
                <label for="freetext">Text to send</label>
            </div>
            <button id="send-text" class="md-btn md-btn-tonal" type="button" disabled>
                <svg class="icon btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
                <span class="spinner"></span>
                <span class="btn-label">Send Text</span>
                <span class="btn-loading-label">Sending…</span>
            </button>
        </section>
    </main>

    <script type="module" src="popup.js"></script>
</body>
</html>
