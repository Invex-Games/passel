<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passel</title>
    <link rel="stylesheet" href="popup.css" />
</head>
<body>
    <header>
        <img src="icons/icon-48.png" alt="Passel" class="header-icon" />
        <div class="header-text">
            <span class="header-title">Passel</span>
            <span id="sync-label" class="header-subtitle hidden"></span>
        </div>
        <div class="header-actions">
            <!-- Only the popup has it: the side panel (the same page, see build.mjs) is already where it leads. -->
            <button id="side-panel-btn" class="md-btn-icon popup-only" type="button" title="Open in side panel" aria-label="Open in side panel">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <line x1="15" y1="3" x2="15" y2="21" />
                </svg>
            </button>
            <button id="refresh-btn" class="md-btn-icon hidden" type="button" title="Refresh">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                    <polyline points="21 3 21 9 15 9" />
                </svg>
            </button>
            <div id="auth-signed-in" class="header-auth hidden">
                <span id="user-email" class="header-email"></span>
                <button id="sign-out-btn" class="md-btn-icon" type="button" title="Sign out">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main id="main">
        <!-- Shown once the session is known to be signed out; the composer takes its place when signed in. -->
        <section id="auth-signed-out" class="section hidden">
            <button id="sign-in-btn" class="md-btn md-btn-filled" type="button">
                <svg class="icon btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                    <polyline points="10 17 15 12 10 7" />
                    <line x1="15" y1="12" x2="3" y2="12" />
                </svg>
                <span class="spinner"></span>
                <span class="btn-label">Sign in with Google</span>
                <span class="btn-loading-label">Signing in…</span>
            </button>
            <p class="intro">
                Send links and notes between your devices.
                Learn more at <a href="https://passel.link" target="_blank" rel="noopener noreferrer">passel.link</a>.
            </p>

            <!-- Only a development build with DEV_SIGN_IN shows this (see popup.ts): signing in through the
                 API's Dev scheme, as any named user, without Google. -->
            <div id="dev-sign-in" class="dev-sign-in hidden">
                <div class="text-field">
                    <input id="dev-user" type="text" placeholder=" " autocomplete="off" spellcheck="false" />
                    <label for="dev-user">Development user</label>
                </div>
                <button id="dev-sign-in-btn" class="md-btn md-btn-tonal" type="button">
                    <span class="spinner"></span>
                    <span class="btn-label">Sign in as development user</span>
                    <span class="btn-loading-label">Signing in…</span>
                </button>
                <p class="dev-note">
                    Development build: signs in without Google, through the API's Dev scheme.
                    Any name works, and a different name is a different account.
                </p>
            </div>
        </section>

        <!-- Disabled until the session is known, so a signed-in user's popup doesn't jump; hidden while signed out. -->
        <section id="composer" class="section composer disabled-section">
            <button id="send-page" class="md-btn md-btn-filled" type="button" disabled>
                <svg class="icon btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
                    <path d="M2 12h20" />
                </svg>
                <span class="spinner"></span>
                <span class="btn-label">Send Current Page</span>
                <span class="btn-loading-label">Sending…</span>
            </button>

            <div class="composer-row">
                <div class="text-field">
                    <textarea id="freetext" rows="2" placeholder=" " disabled></textarea>
                    <label for="freetext">Text or link to send</label>
                </div>
                <button id="send-text" class="md-btn md-btn-tonal composer-send" type="button" title="Send" disabled>
                    <svg class="icon btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m22 2-7 20-4-9-9-4Z" />
                        <path d="M22 2 11 13" />
                    </svg>
                    <span class="spinner"></span>
                </button>
            </div>
        </section>

        <section class="feed" aria-label="Your packets">
            <div id="feed-list" class="feed-list"></div>
            <div id="feed-end" class="feed-end"></div>
        </section>
    </main>

    <div id="toast" class="toast hidden" role="status">
        <span id="toast-message" class="toast-message"></span>
        <button id="toast-action" class="toast-action hidden" type="button"></button>
    </div>

    <script type="module" src="popup.js"></script>
</body>
</html>
